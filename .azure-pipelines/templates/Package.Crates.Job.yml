#
# Packages the mxc-sdk crate closure into .crate files, once per operating
# system, on that system's own agent.  `cargo package` compiles each crate to
# verify it, so a leg proves the closure builds natively on its OS.
#
# The .crate archive is the crate's source rather than a build output, so the
# legs are expected to produce equivalent tarballs; nothing here compares them.
# Only the Windows leg publishes them as the mxc-crates-package artifact; the
# other two are verification.
#
# --registry works around rust-lang/cargo#17196 (still open as of the 1.93
# toolchain this repo pins), where the overlay holding just-packaged workspace
# siblings is registered under the pre-replacement source id and looked up
# under the post-replacement one.  Both feeds below replace crates-io, so the
# value has to name whichever feed this leg actually configured.  Note the two
# ways of getting it wrong fail differently: naming crates-io re-triggers the
# overlay mismatch above, while naming a feed this leg did not configure fails
# earlier and more obviously with "registry index was not found in any
# configuration".
#
# Packaging itself is plain cargo.  The helper script is still used for the two
# things cargo does not do: the check-template gate that keeps both copies of
# the crate list honest, and -- copied into the artifact -- the stage and
# verify-order subcommands the release job runs without a checkout.

parameters:
  # Official builds resolve through the internal Mxc-Azure-Feed, which
  # Cargo.Setup.Private.yml authenticates to.  Unofficial and fork builds use
  # the public MxcDependencies mirror instead, which is anonymous-read and needs
  # no credentials they do not have.  Defaults to true so 1ES.Release.Crates.yml,
  # which is always official, needs no parameters at its call site.
  - name: isOfficialBuild
    type: boolean
    default: true
  - name: cratesArtifactName
    type: string
    default: mxc-crates-package
  # Leaf-first crate order, expanded at compile time into the `-p` flags for a
  # single `cargo package` call and used as the order of release-order.json.
  #
  # GENERATED.  Do not hand-edit or hand-sort.  Regenerate with:
  #   python3 .azure-pipelines/scripts/crates_release.py order
  #
  # This is the same list Publish.CratesIo.Job.yml carries.  It has to be
  # duplicated because an Azure Pipelines template cannot read another
  # template's parameter defaults, so the check-template step below runs once
  # per file and fails the build if either copy drifts from the workspace.
  - name: crateOrder
    type: object
    default:
    - isolation_session_bindings
    - learning_mode_core
    - mxc_pty
    - mxc_telemetry
    - nanvix_common
    - process_security_environment_spec
    - sandbox_spec
    - wxc_common
    - hyperlight_common
    - isolation_session_common
    - learning_mode_windows
    - lxc_common
    - nanvix_runner
    - seatbelt_common
    - windows_sandbox_common
    - wslc_common
    - appcontainer_common
    - bwrap_common
    - windows_sandbox_lifecycle
    - mxc_engine
    - mxc-sdk
  - name: matrix
    type: object
    default:
      - name: windows_x64
        os: windows
        triplet: x86_64-pc-windows-msvc
        poolName: Azure-Pipelines-1ESPT-ExDShared
        poolImage: windows-2022
        poolOs: windows
      - name: linux_x64
        os: linux
        triplet: x86_64-unknown-linux-gnu
        poolName: Azure-Pipelines-1ESPT-ExDShared
        poolImage: ubuntu-latest
        poolOs: linux
      - name: macos_arm64
        os: macos
        triplet: aarch64-apple-darwin
        poolName: Azure Pipelines
        poolImage: macOS-15-arm64
        poolOs: macOS

jobs:
  - ${{ each item in parameters.matrix }}:
    - job: package_crates_${{ item.name }}
      displayName: Package Crates (${{ item.os }})

      # macOS is not offered by the 1ES managed pool, so it runs on the
      # Microsoft-hosted pool, which names the image `vmImage` rather than
      # `image`.
      pool:
        name: ${{ item.poolName }}
        ${{ if eq(item.os, 'macos') }}:
          vmImage: ${{ item.poolImage }}
        ${{ else }}:
          image: ${{ item.poolImage }}
        os: ${{ item.poolOs }}

      variables:
        outDir: $(Build.SourcesDirectory)/out/crates
        # Must name the feed that replaced crates-io on this leg -- see the
        # cargo#17196 note at the top of this file.
        ${{ if eq(parameters.isOfficialBuild, true) }}:
          cargoRegistry: Mxc-Azure-Feed
        ${{ else }}:
          cargoRegistry: MxcDependencies
        # python3 on Windows is often an App Execution Alias stub that opens
        # the Store.
        ${{ if eq(item.os, 'windows') }}:
          python: python
        ${{ if ne(item.os, 'windows') }}:
          python: python3

      steps:
        - checkout: self

        - template: Rust.Toolchain.Public.yml@self
          parameters:
            targetTriple: ${{ item.triplet }}

        # 1ES network isolation blocks crates.io either way, so one of these
        # two mirrors always has to be configured.
        - ${{ if eq(parameters.isOfficialBuild, true) }}:
          - template: Cargo.Setup.Private.yml@self
        - ${{ else }}:
          - template: Cargo.Setup.Public.yml@self

        - ${{ if eq(item.os, 'windows') }}:
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              & $(python) .azure-pipelines/scripts/crates_release.py check-template --manifest-path src/Cargo.toml --template-path .azure-pipelines/templates/Publish.CratesIo.Job.yml
              if ($LASTEXITCODE -ne 0) { throw "check-template failed with exit $LASTEXITCODE" }
              & $(python) .azure-pipelines/scripts/crates_release.py check-template --manifest-path src/Cargo.toml --template-path .azure-pipelines/templates/Package.Crates.Job.yml --require-full
              if ($LASTEXITCODE -ne 0) { throw "check-template failed with exit $LASTEXITCODE" }
            displayName: Verify crate order matches the workspace
            workingDirectory: $(Build.SourcesDirectory)

        # Cargo builds the sibling overlay it verifies each crate against in
        # target/package and never prunes it, so .crate files left by an
        # earlier run with different versions survive there and make this run
        # fail with "no hash listed for <crate>" (rust-lang/cargo#16011).
        # Whether a given agent starts clean is a pool property this template
        # cannot check, so it always removes the directory.
        #
        # One cargo call packages the whole closure: cargo resolves the crates
        # against each other inside that overlay, which is the only way to
        # package a crate whose path dependencies are not on the registry yet.
        # --registry has to name the feed that replaced crates-io on this leg,
        # or cargo looks the overlay up under the wrong source id
        # (rust-lang/cargo#17196).  Verification stays on, so this really does
        # build every crate from its packaged form.
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $targetDir = (cargo metadata --format-version 1 --no-deps --manifest-path src/Cargo.toml | ConvertFrom-Json).target_directory
            $packageDir = Join-Path $targetDir 'package'
            if (Test-Path $packageDir)
            {
                Write-Host "removing stale $packageDir"
                Remove-Item -Recurse -Force $packageDir
            }
            cargo package --manifest-path src/Cargo.toml --registry $(cargoRegistry) -p ${{ join(' -p ', parameters.crateOrder) }}
            if ($LASTEXITCODE -ne 0) { throw "cargo package failed with exit $LASTEXITCODE" }
          displayName: Package crate closure
          workingDirectory: $(Build.SourcesDirectory)

        - ${{ if eq(item.os, 'windows') }}:
          # release-order.json is the hand-off to the publish stage.  It pins
          # the order ESRP uploads in, the sha256 of every file so staging can
          # fail closed if the artifact does not match what this build
          # produced, and the first-party dependency edges verify-order uses to
          # prove the published sequence is still leaf-first.
          #
          # The edges come straight out of `cargo metadata`: a dependency
          # counts when it is a path dependency, is itself in crateOrder, and
          # is not dev-only.  That is set membership, not a second copy of the
          # script's release-graph logic -- the validation it does (every local
          # dependency carries a registry version, and none is missing from
          # CRATES) already ran in the check-template step above, which fails
          # the build before anything is packaged.
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $metadata = cargo metadata --format-version 1 --no-deps --manifest-path src/Cargo.toml | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed with exit $LASTEXITCODE" }
              $packageDir = Join-Path $metadata.target_directory 'package'
              $outDir = '$(outDir)'
              New-Item -ItemType Directory -Force -Path $outDir | Out-Null

              $order = '${{ join(',', parameters.crateOrder) }}' -split ','
              $position = @{}
              for ($i = 0; $i -lt $order.Count; $i++) { $position[$order[$i]] = $i }

              $entries = @()
              foreach ($name in $order)
              {
                  $prefix = "$name-"
                  $found = @(Get-ChildItem -Path $packageDir -Filter "$prefix*.crate" -File)
                  if ($found.Count -ne 1)
                  {
                      throw "expected exactly one .crate for $name, found $($found.Count)"
                  }
                  $package = @($metadata.packages | Where-Object { $_.name -eq $name })
                  if ($package.Count -ne 1)
                  {
                      throw "expected exactly one workspace package named $name, found $($package.Count)"
                  }
                  $edges = @($package[0].dependencies |
                      Where-Object { $_.path -and $position.ContainsKey($_.name) -and $_.kind -ne 'dev' } |
                      ForEach-Object { $_.name } |
                      Sort-Object -Unique |
                      Sort-Object { $position[$_] })
                  Copy-Item $found[0].FullName -Destination $outDir
                  $entries += [ordered]@{
                      name         = $name
                      version      = $found[0].BaseName.Substring($prefix.Length)
                      file         = $found[0].Name
                      sha256       = (Get-FileHash $found[0].FullName -Algorithm SHA256).Hash.ToLower()
                      dependencies = @($edges)
                  }
                  Write-Host "OK    packaged $($found[0].Name)"
              }
              @{ crates = $entries } | ConvertTo-Json -Depth 6 |
                  Set-Content -Path (Join-Path $outDir 'release-order.json') -Encoding utf8NoBOM
            displayName: Collect crates and write release-order.json
            workingDirectory: $(Build.SourcesDirectory)

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              Copy-Item .azure-pipelines/scripts/crates_release.py -Destination "$(outDir)/"
            displayName: Copy the release script into the artifact
            workingDirectory: $(Build.SourcesDirectory)

          - task: 1ES.PublishPipelineArtifact@1
            displayName: Publish crate package artifact
            inputs:
              path: $(outDir)
              artifactName: ${{ parameters.cratesArtifactName }}
