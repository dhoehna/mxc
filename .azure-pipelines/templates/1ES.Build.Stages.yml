# Shared build stages used by `1ES.Build.yml` (PR/CI) and
# `1ES.Build.Official.yml` (signed). `isOfficialBuild` gates signing steps;
# `ESRPInfo` is populated by the official pipeline from the
# MXC-ESRP-Signing variable group and left empty otherwise.

parameters:
  - name: isOfficialBuild
    type: boolean

  - name: debug
    type: boolean
    default: false

  # Runs `cargo package` for the crate closure on Windows, Linux, and macOS so
  # a per-OS packaging break is caught on the build that introduced it.  Kept as
  # a parameter purely as an escape hatch: set it to false to skip the stage.
  - name: packageCrates
    type: boolean
    default: true

  - name: ESRPInfo
    type: object
    default:
      serviceName: ''
      tenantId: ''
      azureKeyVaultName: ''
      authCertName: ''
      signCertName: ''
      clientId: ''

stages:
- stage: Build_Binaries
  displayName: 'Build Executables'
  jobs:

    - template: Rust.Build.Job.yml
      parameters:
        isOfficialBuild: ${{ parameters.isOfficialBuild }}
        matrix:
          - name: windows_x64
            os: windows
            arch: x64
            component: WXC
          - name: windows_arm64
            os: windows
            arch: arm64
            component: WXC
          - name: linux_x64
            os: linux
            arch: x64
            component: LXC
          - name: linux_arm64
            os: linux
            arch: arm64
            component: LXC

        ESRPInfo: ${{ parameters.ESRPInfo }}

    # macOS uses a separate template because it runs on a different
    # pool (Microsoft-hosted). The produced artifact name follows the same
    # scheme (mxc-binaries-<triplet>) so Package_MXC_NPM_SDK can consume it.
    - template: Mac.Build.Job.yml
      parameters:
        isOfficialBuild: ${{ parameters.isOfficialBuild }}
        ESRPInfo: ${{ parameters.ESRPInfo }}

- stage: Package_MXC
  displayName: 'Package MXC'
  dependsOn: Build_Binaries
  jobs:
  - template: Package.NpmSdk.Job.yml
    parameters:
      targets:
        - artifact: wxc-binaries-x86_64-pc-windows-msvc
          sdkArch: x64
        - artifact: wxc-binaries-aarch64-pc-windows-msvc
          sdkArch: arm64
        - artifact: lxc-binaries-x86_64-unknown-linux-gnu
          sdkArch: x64
        - artifact: lxc-binaries-aarch64-unknown-linux-gnu
          sdkArch: arm64
        - artifact: mxc-binaries-aarch64-apple-darwin
          sdkArch: arm64

      ESRPInfo: ${{ parameters.ESRPInfo }}

  - template: Mxc.Binary.Packaging.Job.yml

# Runs on official and unofficial builds alike: the point is to prove every
# supported OS can package the closure, and a PR that breaks packaging on one
# OS should fail on that PR.  The job picks the internal or public mirror from
# isOfficialBuild, since an unofficial build cannot authenticate to the
# internal feed.
- ${{ if parameters.packageCrates }}:
  - stage: Package_Crates
    displayName: 'Package Crates'
    # Source-only (no binaries), so it does not depend on Build_Binaries.
    # Verification only: 1ES.Release.Crates.yml declares no pipeline resource, so
    # it repackages from the release ref and publishes that artifact, and the one
    # produced here is never consumed.  Isolated in its own stage so it never
    # gates npm packaging or the integration tests that depend on Package_MXC.
    dependsOn: []
    jobs:
    - template: Package.Crates.Job.yml
      parameters:
        isOfficialBuild: ${{ parameters.isOfficialBuild }}
        # The release pipeline declares this list in 1ES.Release.Crates.yml,
        # where one copy drives both packaging and publishing.  A template
        # parameter cannot be shared across pipelines, so the verification leg
        # carries its own copy.  Drift here weakens this check; it cannot
        # produce a bad release, which is driven entirely by the release
        # pipeline's copy.
        crateOrder:
        - isolation_session_bindings
        - learning_mode_core
        - mxc_pty
        - mxc_telemetry
        - nanvix_common
        - process_security_environment_spec
        - sandbox_spec
        - wxc_common
        - hyperlight_common
        - isolation_session_common
        - learning_mode_windows
        - lxc_common
        - nanvix_runner
        - seatbelt_common
        - windows_sandbox_common
        - wslc_common
        - appcontainer_common
        - bwrap_common
        - windows_sandbox_lifecycle
        - mxc_engine
        - mxc-sdk

- stage: Lint
  displayName: 'Lint'
  dependsOn: []
  jobs:
  - template: Lint.Job.yml
    parameters:
      isOfficialBuild: ${{ parameters.isOfficialBuild }}

- stage: SDK_Unit_Tests
  displayName: 'SDK Unit Tests'
  dependsOn: []
  jobs:
  - template: SDK.Unit.Test.Job.yml
    parameters:
      debug: ${{ parameters.debug }}

- stage: SDK_Integration_Tests
  displayName: 'SDK Integration Tests'
  dependsOn: Package_MXC
  jobs:
  - template: SDK.Integration.Test.Job.yml
    parameters:
      debug: ${{ parameters.debug }}
